<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TyagiCore Dynamic Interaction Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .star-rating i { cursor: pointer; transition: color 0.2s; }
        .comment-node { position: relative; }
        .comment-node::before {
            content: ''; position: absolute; left: -20px; top: 0; bottom: 0;
            width: 2px; background: #e5e7eb;
        }
        .reply-container { margin-left: 2.5rem; border-left: 2px dashed #e5e7eb; padding-left: 1rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">TyagiCore Feedback Engine</h1>
                <p class="text-sm text-slate-500 mt-1" id="current-url-display">Page: /dashboard</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-center">
                    <span class="block text-3xl font-extrabold text-slate-900" id="avg-rating-num">0.0</span>
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Avg Rating</span>
                </div>
                <div class="h-10 w-px bg-slate-200"></div>
                <div class="text-center">
                    <span class="block text-3xl font-extrabold text-indigo-600" id="total-votes-count">0</span>
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Total Votes</span>
                </div>
            </div>
        </div>

        <div class="bg-indigo-900 text-indigo-100 rounded-2xl p-5 shadow-md mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-800 p-2.5 rounded-xl text-indigo-300">
                    <i class="fa-solid fa-user-shield text-xl"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-white">Identity Core (Session)</h3>
                    <p class="text-xs text-indigo-200" id="identity-status">Active Logged User Session</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                <input type="text" id="user-name" placeholder="Your Name" value="Rahul Tyagi" class="bg-indigo-800 border border-indigo-700 text-white rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 w-full sm:w-32">
                <input type="email" id="user-email" placeholder="Email" value="tyagihub.core@gmail.com" class="bg-indigo-800 border border-indigo-700 text-white rounded-xl px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 w-full sm:w-48">
                <button onclick="registerFCMTokenSimulated()" class="bg-white text-indigo-900 px-4 py-1.5 rounded-xl text-sm font-semibold hover:bg-indigo-50 transition w-full sm:w-auto shadow-sm">Sync FCM</button>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8">
            <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-500"></i> Write a Public Review
            </h2>
            
            <div class="flex items-center gap-3 mb-4 bg-slate-50 p-3 rounded-xl w-fit">
                <span class="text-sm font-medium text-slate-600">Your Rating:</span>
                <div class="star-rating text-amber-400 flex gap-1" id="primary-stars">
                    <i class="fa-regular fa-star text-lg" data-value="1"></i>
                    <i class="fa-regular fa-star text-lg" data-value="2"></i>
                    <i class="fa-regular fa-star text-lg" data-value="3"></i>
                    <i class="fa-regular fa-star text-lg" data-value="4"></i>
                    <i class="fa-regular fa-star text-lg" data-value="5"></i>
                </div>
                <span id="rating-label" class="text-xs text-slate-400 font-bold bg-slate-200 px-2 py-0.5 rounded-md">0/5</span>
            </div>

            <div class="relative">
                <textarea id="comment-text" rows="4" placeholder="Share your experience or query... Try typing 'download pdf notes' to trigger smart bot auto-reply." class="w-full rounded-xl border border-slate-200 p-4 text-sm focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition resize-none"></textarea>
            </div>

            <div class="flex justify-end mt-4">
                <button onclick="submitReview()" id="submit-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm px-6 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> Publish Interaction
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <h3 class="text-md font-bold text-slate-600 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-comments text-slate-400"></i> Discussion Pipeline
            </h3>
            <div id="comments-container" class="space-y-4">
                <div class="text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                    <p class="text-sm">Fetching structural node matrices...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwRoDTUE2LbVmJMmPk-Jf_3TRh0PVrR7NHud9hSrZEzY_qBEE9o4ZcSrs6LcTrisxJPEA/exec";
        let SELECTED_RATING = 0;
        let CURRENT_URL = window.location.pathname === "/" ? "/dashboard" : window.location.pathname;

        document.getElementById('current-url-display').innerText = `Page Context: ${CURRENT_URL}`;

        // Initialize Star Event Listeners
        const stars = document.querySelectorAll('#primary-stars i');
        stars.forEach(star => {
            star.addEventListener('click', (e) => {
                SELECTED_RATING = parseInt(e.target.getAttribute('data-value'));
                updateStarUI(SELECTED_RATING);
            });
            star.addEventListener('mouseover', (e) => {
                const hoverVal = parseInt(e.target.getAttribute('data-value'));
                highlightStars(hoverVal);
            });
            star.addEventListener('mouseleave', () => {
                highlightStars(SELECTED_RATING);
            });
        });

        function updateStarUI(val) {
            document.getElementById('rating-label').innerText = `${val}/5`;
            highlightStars(val);
        }

        function highlightStars(val) {
            stars.forEach((star, idx) => {
                if (idx < val) {
                    star.classList.remove('fa-regular');
                    star.classList.add('fa-solid');
                } else {
                    star.classList.remove('fa-solid');
                    star.classList.add('fa-regular');
                }
            });
        }

        // Fetch Logs Map via GET Method
        async function fetchPipelineLogs() {
            try {
                const response = await fetch(`${API_ENDPOINT}?url=${encodeURIComponent(CURRENT_URL)}`);
                const data = await response.json();
                
                // Set Header Metrics
                document.getElementById('avg-rating-num').innerText = data.avgRating || "0.0";
                document.getElementById('total-votes-count').innerText = data.totalVotes || 0;

                const container = document.getElementById('comments-container');
                container.innerHTML = '';

                if (!data.comments || data.comments.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-12 bg-white rounded-2xl border border-slate-100 text-slate-400">
                            <i class="fa-solid fa-folder-open text-3xl mb-2 block"></i> No reviews logged for this node link yet.
                        </div>`;
                    return;
                }

                // Map/Index calculations for hierarchical dynamic threading
                const rootComments = data.comments.filter(c => c.parentId === "0" || !c.parentId);
                const replyMap = data.comments.filter(c => c.parentId && c.parentId !== "0");

                rootComments.forEach(comment => {
                    let starHTML = '';
                    let rNum = parseInt(comment.userRating) || 0;
                    if(rNum > 0) {
                        starHTML = `<div class="text-amber-400 text-xs">` + `<i class="fa-solid fa-star"></i>`.repeat(rNum) + `</div>`;
                    }

                    let adminBadge = comment.isAdmin ? `<span class="bg-red-100 text-red-700 text-[10px] font-extrabold px-1.5 py-0.5 rounded-md uppercase tracking-wider ml-2 border border-red-200">Admin Core</span>` : '';
                    let userEmail = document.getElementById('user-email').value;
                    let actionsHTML = '';
                    
                    if(comment.email === userEmail || userEmail === "tyagihub.core@gmail.com") {
                        actionsHTML = `
                            <button onclick="deleteNodeRow('${comment.rowId}')" class="text-slate-400 hover:text-red-500 text-xs transition flex items-center gap-1"><i class="fa-solid fa-trash-can"></i> Delete</button>
                            <span class="text-slate-300">•</span>
                            <button onclick="triggerInlineEdit('${comment.rowId}', \`${comment.comment}\`)" class="text-slate-400 hover:text-indigo-500 text-xs transition flex items-center gap-1"><i class="fa-solid fa-user-pen"></i> Edit</button>
                            <span class="text-slate-300">•</span>
                        `;
                    }

                    let commentBlock = document.createElement('div');
                    commentBlock.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-100 transition hover:shadow-md';
                    commentBlock.id = `node-${comment.rowId}`;
                    commentBlock.innerHTML = `
                        <div class="flex items-start gap-3">
                            <img src="${comment.pic}" alt="avatar" class="w-10 h-10 rounded-full border border-slate-100 bg-slate-50 object-cover flex-shrink-0">
                            <div class="flex-1 min-w-0">
                                <div class="flex flex-wrap items-center justify-between gap-2">
                                    <div class="flex items-center">
                                        <h4 class="font-bold text-slate-900 text-sm truncate">${comment.name}</h4>
                                        ${adminBadge}
                                    </div>
                                    <span class="text-xs text-slate-400 font-medium">${comment.date}</span>
                                </div>
                                <div class="mt-1 flex items-center gap-2">${starHTML}</div>
                                <p class="text-sm text-slate-700 mt-2 whitespace-pre-line leading-relaxed" id="text-container-${comment.rowId}">${comment.comment}</p>
                                
                                <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        ${actionsHTML}
                                        <button onclick="toggleReplyBox('${comment.rowId}')" class="text-indigo-600 hover:text-indigo-700 font-semibold text-xs transition flex items-center gap-1"><i class="fa-solid fa-reply"></i> Reply</button>
                                    </div>
                                </div>

                                <div id="reply-box-wrap-${comment.rowId}" class="hidden mt-4 bg-slate-50 p-3 rounded-xl border border-slate-200/60">
                                    <div class="flex gap-2">
                                        <input type="text" id="reply-input-${comment.rowId}" placeholder="Write your reply to this row tracking node..." class="w-full text-xs rounded-lg border border-slate-200 p-2.5 focus:outline-none focus:border-indigo-500 bg-white">
                                        <button onclick="submitReply('${comment.rowId}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2 rounded-lg shadow-sm transition">Send</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="nested-replies-port-${comment.rowId}" class="mt-4 space-y-3"></div>
                    `;

                    container.appendChild(commentBlock);

                    // Map Child Nodes / Replies beneath parents
                    const childReplies = replyMap.filter(r => r.parentId === comment.rowId);
                    childReplies.forEach(reply => {
                        const port = document.getElementById(`nested-replies-port-${comment.rowId}`);
                        let childAdminBadge = reply.isAdmin ? `<span class="bg-red-100 text-red-700 text-[9px] font-extrabold px-1.5 py-0.5 rounded-md uppercase ml-1.5">Admin</span>` : '';
                        
                        let replyRowActions = '';
                        if(reply.email === userEmail || userEmail === "tyagihub.core@gmail.com") {
                            replyRowActions = `
                                <div class="flex items-center gap-2 mt-1">
                                    <button onclick="deleteNodeRow('${reply.rowId}')" class="text-[11px] text-slate-400 hover:text-red-500 transition">Delete</button>
                                    <span class="text-slate-200">|</span>
                                    <button onclick="triggerInlineEdit('${reply.rowId}', \`${reply.comment}\`)" class="text-[11px] text-slate-400 hover:text-indigo-500 transition">Edit</button>
                                </div>
                            `;
                        }

                        let replyEl = document.createElement('div');
                        replyEl.className = 'reply-container mt-2 bg-slate-50/60 p-3 rounded-xl border border-slate-100';
                        replyEl.innerHTML = `
                            <div class="flex items-start gap-2.5">
                                <img src="${reply.pic}" class="w-7 h-7 rounded-full bg-slate-100 object-cover flex-shrink-0">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between">
                                        <div class="flex items-center">
                                            <span class="font-bold text-slate-800 text-xs">${reply.name}</span>
                                            ${childAdminBadge}
                                        </div>
                                        <span class="text-[10px] text-slate-400">${reply.date}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 mt-1" id="text-container-${reply.rowId}">${reply.comment}</p>
                                    ${replyRowActions}
                                </div>
                            </div>
                        `;
                        port.appendChild(replyEl);
                    });
                });

            } catch (err) {
                console.error("Pipeline Sync Critical Fail:", err);
            }
        }

        // Post Execution Block
        async function submitReview() {
            const commentVal = document.getElementById('comment-text').value.trim();
            const nameVal = document.getElementById('user-name').value.trim();
            const emailVal = document.getElementById('user-email').value.trim();

            if (!commentVal) return alert('Comment context cannot be empty strings!');

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Stacking...`;

            const payload = {
                action: "append",
                name: nameVal,
                email: emailVal,
                url: CURRENT_URL,
                rating: String(SELECTED_RATING),
                comment: commentVal,
                parentId: "0"
            };

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors', // standard integration safety bypassing CORS pre-flight
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Clear Primary Field Node
                document.getElementById('comment-text').value = '';
                SELECTED_RATING = 0;
                updateStarUI(0);
                
                // Re-poll database tree structures
                setTimeout(() => {
                    fetchPipelineLogs();
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Publish Interaction`;
                }, 1500);

            } catch (err) {
                console.error(err);
                btn.disabled = false;
            }
        }

        // Handle Thread Replies Toggle View
        function toggleReplyBox(id) {
            const target = document.getElementById(`reply-box-wrap-${id}`);
            target.classList.toggle('hidden');
        }

        // Publish Nested Child Replies Node Row
        async function submitReply(parentId) {
            const inputField = document.getElementById(`reply-input-${parentId}`);
            const commentVal = inputField.value.trim();
            const nameVal = document.getElementById('user-name').value.trim();
            const emailVal = document.getElementById('user-email').value.trim();

            if (!commentVal) return alert('Reply tracking sequence context cannot be empty!');

            const payload = {
                action: "append",
                name: nameVal,
                email: emailVal,
                url: CURRENT_URL,
                rating: "0",
                comment: commentVal,
                parentId: String(parentId)
            };

            try {
                await fetch(API_ENDPOINT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                inputField.value = '';
                toggleReplyBox(parentId);
                setTimeout(fetchPipelineLogs, 1500);
            } catch (e) { console.error(e); }
        }

        // Module 2B Handler: Delete Target Tracker
        async function deleteNodeRow(rowId) {
            if(!confirm("Are you sure you want to wipe this track from Master Tracker?")) return;
            const emailVal = document.getElementById('user-email').value.trim();

            const payload = {
                action: "delete",
                rowId: String(rowId),
                userEmail: emailVal
            };

            try {
                // Post processing to direct API execution pipeline
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const output = await res.json();
                
                if(output.status === "success") {
                    alert('Data node erased successfully!');
                    fetchPipelineLogs();
                } else {
                    alert(`Unauthorized access request: ${output.status}`);
                }
            } catch(e) { console.error(e); }
        }

        // Module 2C Trigger: Edit Inline Data Cell rewriter
        function triggerInlineEdit(rowId, oldComment) {
            const container = document.getElementById(`text-container-${rowId}`);
            container.innerHTML = `
                <div class="mt-2 flex flex-col gap-2">
                    <textarea id="edit-input-${rowId}" class="w-full text-xs rounded-lg border border-slate-300 p-2 focus:outline-none focus:border-indigo-500">${oldComment}</textarea>
                    <div class="flex gap-1 justify-end">
                        <button onclick="cancelInlineEdit('${rowId}', \`${oldComment}\`)" class="bg-slate-200 px-2.5 py-1 text-[11px] font-bold rounded-md">Cancel</button>
                        <button onclick="saveInlineEdit('${rowId}')" class="bg-indigo-600 text-white px-2.5 py-1 text-[11px] font-bold rounded-md">Save Changes</button>
                    </div>
                </div>
            `;
        }

        function cancelInlineEdit(rowId, oldComment) {
            document.getElementById(`text-container-${rowId}`).innerText = oldComment;
        }

        async function saveInlineEdit(rowId) {
            const newComment = document.getElementById(`edit-input-${rowId}`).value.trim();
            const emailVal = document.getElementById('user-email').value.trim();

            if(!newComment) return alert('Field stack requires string sequence content.');

            const payload = {
                action: "edit",
                rowId: String(rowId),
                email: emailVal,
                comment: newComment
            };

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const output = await res.json();
                if(output.status === "success") {
                    alert('Node Row rewrite tracking absolute.');
                    fetchPipelineLogs();
                } else {
                    alert('Action unauthorized or targeted node missing.');
                }
            } catch(e) { console.error(e); }
        }

        // Simulated FCM Handlers
        async function registerFCMTokenSimulated() {
            const nameVal = document.getElementById('user-name').value.trim();
            const emailVal = document.getElementById('user-email').value.trim();
            const dummyToken = "fcm_mock_token_" + Math.random().toString(36).substring(2, 15);

            const payload = {
                action: "fcm_subscribe",
                email: emailVal,
                fcmToken: dummyToken,
                name: nameVal
            };

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.status === "saved" || data.status === "updated") {
                    alert(`FCM Token pipeline established successfully: Node status [${data.status}]`);
                    document.getElementById('identity-status').innerText = `Device Sync Active (FCM Connected)`;
                }
            } catch(e) { console.error(e); }
        }

        // Initial Load Execution
        window.addEventListener('DOMContentLoaded', fetchPipelineLogs);
    </script>
</body>
</html>
